services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=file:./prisma/dev.db
      - JWT_SECRET=supersecretkey123
      - PORT=3001
    volumes:
      - uploads_data:/app/uploads
      - db_data:/app/prisma

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads_data:
  db_data: